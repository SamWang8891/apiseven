# APISIX config for local development only. The keys below are public test values.
apisix:
  node_listen: 9080
  enable_ipv6: false
  # HTTPS with the SSL objects' certificates (APISIX's default, written out: compose publishes it).
  ssl:
    enable: true
    listen:
      - port: 9443
  proxy_mode: http&stream
  stream_proxy:
    tcp:
      - addr: 9100

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: apiseven-dev-admin-key
        role: admin
      - name: viewer
        key: apiseven-dev-viewer-key
        role: viewer
    enable_admin_cors: true
    # Requests reach APISIX through Docker's port forwarding, so the source IP is
    # not loopback. The published ports are bound to 127.0.0.1 in compose.yaml.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30
